[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-control"
version = "0.1.0"
description = "Banking control and compliance oversight dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["banking_control*"]
