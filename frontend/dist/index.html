<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banking Control Solution</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-eyebrow">Cloudera Applied AI</p>
            <h1>Banking Control Solution</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="health-pill" class="pill pill-muted">Checking…</span>
          <button type="button" id="assistant-toggle" class="btn btn-secondary" aria-expanded="false" aria-controls="assistant-panel">Assistant</button>
          <button type="button" id="refresh-btn" class="btn btn-secondary">Refresh dashboard</button>
        </div>
      </header>

      <div class="app-shell">
      <main class="layout main-content">
        <section class="hero-metrics" id="overview-cards"></section>

        <div class="grid-two">
          <section class="panel">
            <div class="panel-head">
              <h2>Control catalog</h2>
              <input
                type="search"
                id="control-search"
                class="control-search"
                placeholder="Search code or name…"
                aria-label="Search controls"
              />
              <select id="domain-filter" aria-label="Filter by domain">
                <option value="">All domains</option>
              </select>
              <label class="inline-label">
                <input type="checkbox" id="golden-filter" />
                MVP golden only
              </label>
              <span id="control-count-label" class="panel-meta"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Code</th>
                    <th>Control</th>
                    <th>Domain</th>
                    <th>Risk</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="controls-body"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Transaction monitoring alerts</h2>
              <label class="inline-label">
                Min risk
                <input type="range" id="risk-slider" min="0" max="100" value="0" />
                <span id="risk-label">0.00</span>
              </label>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>When</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Risk</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="alerts-body"></tbody>
              </table>
            </div>
          </section>
        </div>

        <div class="grid-two">
          <section class="panel">
            <div class="panel-head">
              <h2>Open control exceptions</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Severity</th>
                    <th>Due</th>
                    <th>Status</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="exceptions-body"></tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Audit trail</h2>
            </div>
            <ul id="audit-list" class="audit-list"></ul>
          </section>
        </div>
      </main>

      <div id="assistant-backdrop" class="assistant-backdrop" aria-hidden="true"></div>
      <aside id="assistant-panel" class="assistant-panel" aria-label="Control assistant" aria-hidden="true">
        <div class="assistant-head">
          <div>
            <h2>Control assistant</h2>
            <span id="assistant-status" class="pill pill-muted">Checking LLM…</span>
          </div>
          <button type="button" id="assistant-admin-toggle" class="btn btn-ghost">Admin</button>
        </div>
        <div id="assistant-admin" class="assistant-admin hidden">
          <form id="admin-llm-form">
            <label>Provider
              <select name="provider_type">
                <option value="bedrock">Amazon Bedrock</option>
                <option value="openai_compatible">Local / OpenAI-compatible</option>
              </select>
            </label>
            <label>Bedrock region <input name="bedrock_region" placeholder="eu-west-1" /></label>
            <label>Bedrock model id <input name="bedrock_model_id" /></label>
            <label>Max tokens <input name="bedrock_max_tokens" type="number" /></label>
            <label>Temperature <input name="bedrock_temperature" type="number" step="0.05" /></label>
            <label>Local base URL <input name="openai_base_url" placeholder="http://127.0.0.1:8000/v1" /></label>
            <label>Local model id <input name="openai_model_id" /></label>
            <label>API token <input name="openai_api_token" type="password" autocomplete="off" /></label>
            <div class="assistant-admin-actions">
              <button type="button" id="admin-llm-test" class="btn btn-secondary">Test</button>
              <button type="submit" class="btn btn-secondary">Save</button>
            </div>
          </form>
        </div>
        <div id="assistant-history" class="assistant-history"></div>
        <form id="assistant-form" class="assistant-form">
          <textarea id="assistant-input" rows="3" placeholder="Ask about controls, run a simulation, or explore audit events…"></textarea>
          <button type="submit" class="btn btn-secondary">Send</button>
        </form>
      </aside>
      </div>
    </div>
    <script src="/assets/assistant.js?v=3"></script>
    <script src="/assets/app.js?v=3"></script>
  </body>
</html>
